map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

server {
    listen 80;
    server_name weather.sh-newenergy.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name weather.sh-newenergy.com;

    ssl_certificate /etc/nginx/certs/sh-newenergy.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/sh-newenergy.com.key;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/xml+rss application/javascript application/json;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /windy/ {
        proxy_pass ${WINDY_PROXY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /adminer/ {
        proxy_pass http://host.docker.internal:8882/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /api/v2/ {
        proxy_pass http://host.docker.internal:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /test-nginx {
        default_type text/plain;
        return 200 "Nginx is working! Access time: $time_local\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8890;
    server_name _;

    location / {
        default_type text/plain;
        return 200 "8890 TEST OK\n";
    }
}
