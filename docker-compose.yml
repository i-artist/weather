services:
  weather:
    build:
      context: .
      args:
        MAPTILER_PUBLIC_VALUE: ${VITE_MAPTILER_API_KEY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    ports:
      - "${WEATHER_PORT:-8080}:80"
    environment:
      WINDY_PROXY_UPSTREAM: ${WINDY_PROXY_UPSTREAM:-http://windy-proxy:3002}
    depends_on:
      windy-proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5

  windy-proxy:
    build: ./windy-proxy
    environment:
      WINDY_API_KEY: ${WINDY_API_KEY:?WINDY_API_KEY is required}
      WINDY_AUTH_HOSTNAME: ${WINDY_AUTH_HOSTNAME:-weather-proxy.theonly.vip}
      WINDY_ALLOWED_APP_HOSTS: ${WINDY_ALLOWED_APP_HOSTS:-localhost,127.0.0.1,weather.sh-newenergy.com}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_FEISHU_WEBHOOK: ${ALERT_FEISHU_WEBHOOK:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-465}
      ALERT_SMTP_TLS: ${ALERT_SMTP_TLS:-implicit}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_MAIL_TO: ${ALERT_MAIL_TO:-}
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-600}
    restart: unless-stopped
