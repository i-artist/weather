services:
  weather:
    build:
      context: .
      args:
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    ports:
      - "${WEATHER_PORT:-8080}:80"
    environment:
      WINDY_PROXY_UPSTREAM: ${WINDY_PROXY_UPSTREAM:-http://windy-proxy:3002}
    depends_on:
      windy-proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5

  windy-proxy:
    build: ./windy-proxy
    environment:
      WINDY_API_KEY: ${WINDY_API_KEY:?WINDY_API_KEY is required}
      WINDY_ALLOWED_APP_HOSTS: ${WINDY_ALLOWED_APP_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped
