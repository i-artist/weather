services:
  weather:
    build: .
    ports:
      - "8080:80"
    depends_on:
      windy-proxy:
        condition: service_healthy
    restart: unless-stopped

  windy-proxy:
    build: ./windy-proxy
    environment:
      WINDY_API_KEY: ${WINDY_API_KEY:?WINDY_API_KEY is required}
      WINDY_ALLOWED_APP_HOSTS: ${WINDY_ALLOWED_APP_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped
