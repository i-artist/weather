services:
  weather:
    image: ${WEATHER_IMAGE:-weather-pro:latest}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TEST_PORT:-8890}:8890"
    environment:
      WINDY_PROXY_UPSTREAM: ${WINDY_PROXY_UPSTREAM:?WINDY_PROXY_UPSTREAM is required}
      WINDY_BOOT_URL: ${WINDY_BOOT_URL:-}
      SSO_ENABLED: ${SSO_ENABLED:-yes}
      SHENNER_BASE_URL: ${SHENNER_BASE_URL:-https://fgcapi.shenergy.net.cn}
      SHENNER_FGCAPI_HOST: ${SHENNER_FGCAPI_HOST:-https://fgcapi.shenergy.net.cn}
      SHENNER_FGCAM_HOST: ${SHENNER_FGCAM_HOST:-https://fgcam.shenergy.net.cn}
      SHENNER_USERNAME: ${SHENNER_USERNAME:-}
      SHENNER_IOA_SECRET: ${SHENNER_IOA_SECRET:-}
      SHENNER_JWT_SECRET: ${SHENNER_JWT_SECRET:-}
      SHENNER_FGCAM_COOKIE: ${SHENNER_FGCAM_COOKIE:-}
      SSO_TIMEOUT_SECONDS: ${SSO_TIMEOUT_SECONDS:-10}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
    volumes:
      - ./nginx.intranet.conf:/etc/nginx/templates/default.conf.template:ro
      - ./server.py:/app/server.py:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8890/"]
      interval: 15s
      timeout: 3s
      retries: 5
